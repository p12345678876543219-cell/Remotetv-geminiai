name: Build IPA Release

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build iOS App and Package IPA
    runs-on: macos-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Xcode Version
      run: |
        sudo xcode-select -s /Applications/Xcode.app
        xcodebuild -version

    - name: Build App (Unsigned)
      run: |
        # Tự động tìm file .xcodeproj trong thư mục để tránh lỗi sai tên Project/Scheme
        PROJECT_FILE=$(ls -d *.xcodeproj | head -n 1)
        PROJECT_NAME=$(basename "$PROJECT_FILE" .xcodeproj)
        
        echo "Building project: $PROJECT_NAME"
        
        xcodebuild clean build \
          -project "$PROJECT_FILE" \
          -scheme "$PROJECT_NAME" \
          -configuration Release \
          -sdk iphoneos \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CONFIGURATION_BUILD_DIR="./build"

    - name: Package Payload to IPA
      run: |
        PROJECT_FILE=$(ls -d *.xcodeproj | head -n 1)
        PROJECT_NAME=$(basename "$PROJECT_FILE" .xcodeproj)
        
        mkdir -p Payload
        if [ -d "./build/$PROJECT_NAME.app" ]; then
          cp -r "./build/$PROJECT_NAME.app" Payload/
        else
          # Fallback nếu tên app trong build khác tên project
          APP_DIR=$(ls ./build/*.app | head -n 1)
          cp -r "$APP_DIR" Payload/
        fi
        
        zip -r TVRemote_Release.ipa Payload
        rm -rf Payload build

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TVRemote-IPA
        path: TVRemote_Release.ipa
