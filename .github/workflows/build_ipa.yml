name: Build iOS IPA

on:
  push:
    branches: [ main ]

jobs:
  build:
    name: Build iOS App and Generate IPA
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.0'

      - name: Build Archive and Export IPA
        run: |
          xcodebuild -project TVRemoteApp.xcodeproj \
                     -scheme TVRemoteApp \
                     -sdk iphoneos \
                     -configuration Release \
                     -derivedDataPath build \
                     -archivePath build/TVRemoteApp.xcarchive archive

          xcodebuild -exportArchive \
                     -archivePath build/TVRemoteApp.xcarchive \
                     -exportOptionsPlist ExportOptions.plist \
                     -exportPath build/ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TVRemoteApp-IPA
          path: build/ipa/*.ipa
